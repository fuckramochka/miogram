name: Website Build & Deploy

# Builds the Vite site from website/ and deploys static dist/ to GitHub Pages.
# REQUIRED repo setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# NOTE: release.yml ignores website/** so site pushes never trigger APK builds.

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'miosite/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Sync miosite to website
        run: |
          if [ -d "../miosite" ]; then
            cp -rf ../miosite/src/* ./src/ || true
            cp -f ../miosite/index.html . || true
            cp -f ../miosite/vite.config.ts . || true
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck + Build
        run: npm run build
      - name: Verify single-file output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          ls -la dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
