e:"Бесконечное хранилище",tag:"room for your world",text:"Для файлов, воспоминаний и всего, что хочется оставить рядом.",detail:"Храни важное в облачном пространстве Telegram через MioGram. «Бесконечное» описывает отсутствие общего лимита облачной коллекции, а не отмену ограничений Telegram: размер отдельного файла и другие условия сервиса по-прежнему действуют."},{id:"subfolders",category:"tools",symbol:"⊞",name:"Подпапки",tag:"a place for everything",text:"Больше порядка внутри папок. Даже у самого большого чат-листа.",detail:"Разделяй большие подборки на подпапки: для работы, друзей, каналов и личных интересов. Дополнительный уровень организации помогает не превращать список чатов в бесконечную ленту."},{id:"badges",category:"style",symbol:"୨୧",name:"Пиксельные бейджики",tag:"tiny pixels, big personality",text:"Маленькие знаки отличия с большим характером. Найди свой.",detail:"У MioGram есть пиксельные бейджи сообщества с разными стилями и историей получения. В репозитории описаны десять вариантов — от нежного Angel до Glitch и Premium. Условия получения зависят от конкретного бейджа."},{id:"ghost",category:"privacy",symbol:"♧",name:"Режим призрака",tag:"quiet mode, cute soul",text:"Меньше лишнего внимания к твоей активности. Больше личного пространства.",detail:"Режим призрака добавляет настройки видимости активности в клиенте. Он не делает аккаунт анонимным и не отменяет серверные правила Telegram. Какие именно события можно скрывать, проверяй в настройках своей версии."},{id:"deleted",category:"privacy",symbol:"↶",name:"Сохранение удалённых",tag:"a little memory",text:"Сохраняй историю сообщений, даже если её часть удалили из чата.",detail:"Функция сохранения удалённых помогает удержать уже полученные сообщения в клиенте. Это не восстановление любых сообщений с серверов Telegram: ранее недоступные или не полученные клиентом сообщения вернуть таким способом нельзя. Учитывай приватность собеседников."},{id:"updates",category:"tools",symbol:"↻",name:"Поиск и уста
